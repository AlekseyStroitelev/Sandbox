services:
  # Генерация SSL сертификатов с добавлением SAN для каждого брокера
  cert-generator:
    image: docker-proxy.artifactory.tcsbank.ru/apache/kafka:3.9.2
    container_name: cert-generator
    volumes:
      - ./certs:/tmp/certs
    command: |
      bash -c '
      mkdir -p /tmp/certs
      if [ -f /tmp/certs/kafka.truststore.jks ]; then
        echo "Certificates already exist, skipping generation"
        exit 0
      fi

      # CA
      openssl req -x509 -newkey rsa:4096 -keyout /tmp/certs/ca-key -out /tmp/certs/ca-cert -days 365 -nodes -subj "/CN=Kafka-CA"

      # Сертификаты брокеров с SAN = DNS:имя-брокера, DNS:localhost
      for broker in kafka-1 kafka-2 kafka-3; do
        keytool -keystore /tmp/certs/$${broker}.keystore.jks -alias localhost -validity 365 -genkey -keyalg RSA \
          -dname "CN=$${broker}" -ext "SAN=DNS:$${broker},DNS:localhost" -storepass changeit -keypass changeit
        keytool -keystore /tmp/certs/$${broker}.keystore.jks -alias localhost -validity 365 -certreq -keyalg RSA \
          -file /tmp/certs/$${broker}.csr -storepass changeit -keypass changeit
        openssl x509 -req -CA /tmp/certs/ca-cert -CAkey /tmp/certs/ca-key -in /tmp/certs/$${broker}.csr \
          -out /tmp/certs/$${broker}-signed.crt -days 365 -CAcreateserial -passin pass:changeit
        keytool -keystore /tmp/certs/$${broker}.keystore.jks -alias CARoot -importcert -file /tmp/certs/ca-cert \
          -storepass changeit -keypass changeit -noprompt
        keytool -keystore /tmp/certs/$${broker}.keystore.jks -alias localhost -importcert -file /tmp/certs/$${broker}-signed.crt \
          -storepass changeit -keypass changeit -noprompt
      done

      keytool -keystore /tmp/certs/kafka.truststore.jks -alias CARoot -importcert -file /tmp/certs/ca-cert \
        -storepass changeit -keypass changeit -noprompt

      echo "Certificates generated successfully"
      '
    networks:
      - kafka-network

  # Инициализация SCRAM пользователей и ACL (без ANONYMOUS)
  acl-setup:
    image: docker-proxy.artifactory.tcsbank.ru/apache/kafka:3.9.2
    container_name: acl-setup
    volumes:
      - ./certs:/tmp/certs:ro
      - ./client-sasl.conf:/tmp/client-sasl.conf:ro
    networks:
      - kafka-network
    command: |
      bash -c '
      echo "Waiting for Kafka to be ready..."
      sleep 30

      # Создание SCRAM пользователей через PLAINTEXT (только на время инициализации)
      echo "Creating SCRAM users via PLAINTEXT..."
      for user in admin producer consumer schema akhq interbroker; do
        pass_var="$${user}-secret"
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-1:9094 --alter \
          --add-config "SCRAM-SHA-512=[password=$${!pass_var}]" --entity-type users --entity-name $${user}
        echo "Created user: $${user}"
      done

      sleep 5

      # Настройка ACL с использованием SASL (admin)
      echo "Setting up ACLs..."

      # Admin – super.user, но для явности можно оставить (ACL игнорируются)
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:admin" --operation All --topic "*"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:admin" --operation All --group "*"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:admin" --operation All --cluster "kafka-cluster"

      # Producer
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:producer" --operation Write --topic "test"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:producer" --operation Describe --topic "test"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:producer" --operation Create --topic "test"

      # Consumer
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:consumer" --operation Read --topic "test"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:consumer" --operation Describe --topic "test"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:consumer" --operation Read --group "group-*"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:consumer" --operation Describe --group "group-*"

      # Schema Registry (пользователь schema, не ANONYMOUS)
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Read --topic "_schemas"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Write --topic "_schemas"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Describe --topic "_schemas"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Create --topic "_schemas"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Read --group "schema-registry"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:schema" --operation Describe --group "schema-registry"

      # AKHQ
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:akhq" --operation All --topic "*"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:akhq" --operation All --group "*"
      /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --add --allow-principal "User:akhq" --operation Describe --cluster "kafka-cluster"

      # Interbroker добавлен в super.users, поэтому ACL не обязателен

      # Создание тестового топика
      echo "Creating test topic..."
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --command-config /tmp/client-sasl.conf \
        --create --topic test --partitions 3 --replication-factor 3 --if-not-exists
      echo "ACL setup completed successfully"
      '
    depends_on:
      kafka-1:
        condition: service_healthy

  kafka-1:
    image: docker-proxy.artifactory.tcsbank.ru/apache/kafka:3.9.2
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
      # 9094 больше не публикуем наружу
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./client-ssl.conf:/tmp/client-ssl.conf:ro
    command: |
      bash -c '
      # Zookeeper конфигурация
      cat > /opt/kafka/config/zookeeper.properties << "EOF"
      dataDir=/tmp/zookeeper
      clientPort=2181
      maxClientCnxns=0
      admin.enableServer=false
      tickTime=2000
      initLimit=10
      syncLimit=5
      server.1=kafka-1:2888:3888
      server.2=kafka-2:2888:3888
      server.3=kafka-3:2888:3888
      EOF

      mkdir -p /tmp/zookeeper
      echo "1" > /tmp/zookeeper/myid

      # JAAS для подключения к ZooKeeper (суперпользователь admin)
      cat > /opt/kafka/config/kafka_server_jaas.conf << "EOF"
      KafkaServer {
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="admin"
        password="admin-secret";
      };
      EOF

      # server.properties
      cat > /opt/kafka/config/server.properties << "EOF"
      broker.id=1
      zookeeper.connect=kafka-1:2181,kafka-2:2181,kafka-3:2181

      listeners=SASL_SSL://0.0.0.0:9093,SASL_PLAINTEXT://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9094
      advertised.listeners=SASL_PLAINTEXT://kafka-1:29092,SASL_SSL://kafka-1:9093
      listener.security.protocol.map=SASL_SSL:SASL_SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Межброкерное взаимодействие по SASL_PLAINTEXT
      inter.broker.listener.name=SASL_PLAINTEXT

      sasl.enabled.mechanisms=SCRAM-SHA-512
      sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
      listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="interbroker" password="interbroker-secret";

      # SCRAM конфигурация и авторизация
      authorizer.class.name=kafka.security.authorizer.AclAuthorizer
      allow.everyone.if.no.acl.found=false
      super.users=User:admin;User:interbroker

      ssl.keystore.location=/opt/kafka/certs/kafka-1.keystore.jks
      ssl.keystore.password=changeit
      ssl.key.password=changeit
      ssl.truststore.location=/opt/kafka/certs/kafka.truststore.jks
      ssl.truststore.password=changeit
      ssl.client.auth=required

      offsets.topic.replication.factor=3
      group.initial.rebalance.delay.ms=0
      transaction.state.log.min.isr=2
      transaction.state.log.replication.factor=3
      min.insync.replicas=2
      log.dirs=/tmp/kafka-logs
      zookeeper.connection.timeout.ms=18000
      default.replication.factor=3
      num.partitions=3
      EOF

      # Healthcheck-файл для SASL-доступа
      cat > /tmp/healthcheck-client.conf << "EOF"
      security.protocol=SASL_PLAINTEXT
      sasl.mechanism=SCRAM-SHA-512
      sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="interbroker" password="interbroker-secret";
      EOF

      echo "Starting Zookeeper..."
      /opt/kafka/bin/zookeeper-server-start.sh /opt/kafka/config/zookeeper.properties &
      echo "Waiting for Zookeeper..."
      while ! (echo "ruok" > /dev/tcp/localhost/2181) 2>/dev/null; do sleep 2; done
      sleep 5

      echo "Starting Kafka..."
      export KAFKA_OPTS="-Djava.security.auth.login.config=/opt/kafka/config/kafka_server_jaas.conf"
      exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
      '
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

