  schema-registry:
    image: docker-proxy.artifactory.tcsbank.ru/confluentinc/cp-schema-registry:7.8.6
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      acl-setup:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka-1:9094,PLAINTEXT://kafka-2:9094,PLAINTEXT://kafka-3:9094'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
      SCHEMA_REGISTRY_DEBUG: 'true'
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: '3'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kafka-network

  akhq:
    image: docker-proxy.artifactory.tcsbank.ru/tchiotludo/akhq:0.26.0
    container_name: akhq
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      acl-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka-1:9094,kafka-2:9094,kafka-3:9094"
                request.timeout.ms: 5000
                default.api.timeout.ms: 10000
              schema-registry:
                url: "http://schema-registry:8081"
              timeout: 10000
          
          groups:
            admin:
              - role: admin
                clusters:
                  - docker-kafka
            reader:
              - role: reader
                clusters:
                  - docker-kafka
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
