  kafka-2:
    image: apache/kafka:3.9.2
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29095:29092"
      - "9096:9093"
    volumes:
      - ./certs:/opt/kafka/certs:ro
    command: |
      bash -c '
      cat > /opt/kafka/config/zookeeper.properties << "EOF"
      dataDir=/tmp/zookeeper
