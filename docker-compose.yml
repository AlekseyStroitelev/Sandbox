services:
  # Генерация SSL сертификатов для 6 брокеров
  cert-generator:
    image: apache/kafka:3.9.2
    container_name: cert-generator
    volumes:
      - ./certs:/tmp/certs
      - ./scripts:/opt/kafka/scripts:ro
    command: bash /opt/kafka/scripts/generate-certs.sh
    networks:
      - kafka-network

  # ------------------------------------------------------------
  # Первый кластер (primary) — брокеры 1-3
  # ------------------------------------------------------------
  acl-setup-primary:
    image: apache/kafka:3.9.2
    container_name: acl-setup-primary
    volumes:
      - ./certs:/tmp/certs:ro
      - ./client-sasl.conf:/tmp/client-sasl.conf:ro
      - ./scripts:/opt/kafka/scripts:ro
    networks:
      - kafka-network
    command: bash /opt/kafka/scripts/setup-acl.sh
    depends_on:
      kafka-1:
        condition: service_healthy

  kafka-1:
    image: apache/kafka:3.9.2
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"   # SASL_PLAINTEXT
      - "9093:9093"     # SASL_SSL
    environment:
      - BROKER_ID=1
      - MM2_CONFIG=mm2-primary-to-secondary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-1
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-1:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-2:
    image: apache/kafka:3.9.2
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29095:29092"
      - "9096:9093"
    environment:
      - BROKER_ID=2
      - MM2_CONFIG=mm2-primary-to-secondary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-2
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-2:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-3:
    image: apache/kafka:3.9.2
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "29097:29092"
      - "9098:9093"
    environment:
      - BROKER_ID=3
      - MM2_CONFIG=mm2-primary-to-secondary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-3
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-3:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  # ------------------------------------------------------------
  # Второй кластер (secondary) — брокеры 4-6
  # ------------------------------------------------------------
  acl-setup-secondary:
    image: apache/kafka:3.9.2
    container_name: acl-setup-secondary
    volumes:
      - ./certs:/tmp/certs:ro
      - ./client-sasl.conf:/tmp/client-sasl.conf:ro
      - ./scripts:/opt/kafka/scripts:ro
    networks:
      - kafka-network
    command: bash /opt/kafka/scripts/setup-acl-secondary.sh
    depends_on:
      kafka-4:
        condition: service_healthy

  kafka-4:
    image: apache/kafka:3.9.2
    container_name: kafka-4
    hostname: kafka-4
    ports:
      - "29093:29092"   # SASL_PLAINTEXT
      - "9094:9093"     # SASL_SSL
    environment:
      - BROKER_ID=4
      - MM2_CONFIG=mm2-secondary-to-primary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-4
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-4:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-5:
    image: apache/kafka:3.9.2
    container_name: kafka-5
    hostname: kafka-5
    ports:
      - "29094:29092"
      - "9095:9093"
    environment:
      - BROKER_ID=5
      - MM2_CONFIG=mm2-secondary-to-primary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-5
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-5:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-6:
    image: apache/kafka:3.9.2
    container_name: kafka-6
    hostname: kafka-6
    ports:
      - "29096:29092"
      - "9097:9093"
    environment:
      - BROKER_ID=6
      - MM2_CONFIG=mm2-secondary-to-primary.properties
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-6
      - CONNECT_REST_ADVERTISED_PORT=8083
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-6:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
      - ./configs/mm2:/opt/kafka/config/mm2:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  # ------------------------------------------------------------
  # Инфраструктурные сервисы
  # ------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.6
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      acl-setup-primary:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "SASL_PLAINTEXT://kafka-1:29092,SASL_PLAINTEXT://kafka-2:29092,SASL_PLAINTEXT://kafka-3:29092"
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: SCRAM-SHA-512
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"schema\" password=\"schema-secret\";"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_DEBUG: "true"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kafka-network

  akhq:
    image: tchiotludo/akhq:0.26.0
    container_name: akhq
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-4:
        condition: service_healthy
      kafka-5:
        condition: service_healthy
      kafka-6:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      acl-setup-primary:
        condition: service_completed_successfully
      acl-setup-secondary:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
                security.protocol: SASL_PLAINTEXT
                sasl.mechanism: SCRAM-SHA-512
                sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"akhq\" password=\"akhq-secret\";"
              schema-registry:
                url: "http://schema-registry:8081"
              timeout: 10000
            docker-kafka-secondary:
              properties:
                bootstrap.servers: "kafka-4:29092,kafka-5:29092,kafka-6:29092"
                security.protocol: SASL_PLAINTEXT
                sasl.mechanism: SCRAM-SHA-512
                sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"akhq\" password=\"akhq-secret\";"
              timeout: 10000
          groups:
            admin:
              - role: admin
                clusters:
                  - docker-kafka
                  - docker-kafka-secondary
            reader:
              - role: reader
                clusters:
                  - docker-kafka
                  - docker-kafka-secondary
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge