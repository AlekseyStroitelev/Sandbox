services:
  cert-generator:
    image: apache/kafka:3.9.2
    container_name: cert-generator
    volumes:
      - ./certs:/tmp/certs
      - ./scripts:/opt/kafka/scripts:ro
    command: bash /opt/kafka/scripts/generate-certs.sh
    networks:
      - kafka-network

  acl-setup:
    image: apache/kafka:3.9.2
    container_name: acl-setup
    volumes:
      - ./certs:/tmp/certs:ro
      - ./client-sasl.conf:/tmp/client-sasl.conf:ro
      - ./scripts:/opt/kafka/scripts:ro
    networks:
      - kafka-network
    command: bash /opt/kafka/scripts/setup-acl.sh
    depends_on:
      kafka-1:
        condition: service_healthy

  kafka-1:
    image: apache/kafka:3.9.2
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"
      - "9093:9093"
    environment:
      - BROKER_ID=1
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-1:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-2:
    image: apache/kafka:3.9.2
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29095:29092"
      - "9096:9093"
    environment:
      - BROKER_ID=2
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-2:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  kafka-3:
    image: apache/kafka:3.9.2
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "29097:29092"
      - "9098:9093"
    environment:
      - BROKER_ID=3
    volumes:
      - ./certs:/opt/kafka/certs:ro
      - ./configs/kafka-3:/opt/kafka/config/custom:ro
      - ./scripts:/opt/kafka/scripts:ro
    command: bash /opt/kafka/scripts/start-kafka.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/healthcheck-client.conf > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - kafka-network
    depends_on:
      cert-generator:
        condition: service_completed_successfully

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.6
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      acl-setup:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "SASL_PLAINTEXT://kafka-1:29092,SASL_PLAINTEXT://kafka-2:29092,SASL_PLAINTEXT://kafka-3:29092"
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: SCRAM-SHA-512
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"schema\" password=\"schema-secret\";"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_DEBUG: "true"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kafka-network

  akhq:
    image: tchiotludo/akhq:0.26.0
    container_name: akhq
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      acl-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
                security.protocol: SASL_PLAINTEXT
                sasl.mechanism: SCRAM-SHA-512
                sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"akhq\" password=\"akhq-secret\";"
              schema-registry:
                url: "http://schema-registry:8081"
              timeout: 10000
          groups:
            admin:
              - role: admin
                clusters:
                  - docker-kafka
            reader:
              - role: reader
                clusters:
                  - docker-kafka
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge